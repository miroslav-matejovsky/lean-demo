# https://taskfile.dev
# All logic lives in PowerShell scripts under ./taskfile so it is readable,
# debuggable and identical on Windows, Linux (CI) and macOS (pwsh 7+).
version: "3"

vars:
  PS: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File

tasks:
  default:
    desc: List all tasks
    silent: true
    cmds:
      - task --list

  doctor:
    desc: Check that all required tools are installed
    cmds:
      - "{{.PS}} taskfile/doctor.ps1"

  setup:
    desc: Restore all dependencies (Lean build, NuGet, Go modules)
    cmds:
      - task: doctor
      - task: lean:build
      - dotnet restore impl/dotnet
      - go -C impl/go mod download

  # --- the truth ---------------------------------------------------------------

  lean:build:
    desc: Type-check the tutorial and the spec (every proof)
    dir: lean
    cmds:
      - lake build

  lean:audit:
    desc: Fail on sorry/axioms; print the trust base of key theorems
    cmds:
      - "{{.PS}} taskfile/audit.ps1"

  contracts:
    desc: Regenerate contracts, vectors, C#/Go code and docs from the spec
    cmds:
      - "{{.PS}} taskfile/contracts.ps1 -Mode generate"

  contracts:check:
    desc: Drift gate - fail if committed artifacts differ from what the spec generates
    cmds:
      - "{{.PS}} taskfile/contracts.ps1 -Mode check"

  # --- the implementations -----------------------------------------------------

  test:
    desc: Run conformance tests for all implementations
    cmds:
      - "{{.PS}} taskfile/test.ps1 -Impl all"

  test:dotnet:
    desc: Run .NET conformance tests
    cmds:
      - "{{.PS}} taskfile/test.ps1 -Impl dotnet"

  test:go:
    desc: Run Go conformance tests
    cmds:
      - "{{.PS}} taskfile/test.ps1 -Impl go"

  mutate:
    desc: Inject realistic bugs and prove the spec-derived vectors catch them
    cmds:
      - "{{.PS}} taskfile/mutate.ps1 -Impl {{.IMPL | default \"all\"}}"

  # --- the gate ----------------------------------------------------------------

  verify:
    desc: "Full pipeline: proofs, audit, drift, .NET + Go conformance (what CI runs)"
    cmds:
      - "{{.PS}} taskfile/verify.ps1"

  verify:full:
    desc: verify + mutation testing
    cmds:
      - "{{.PS}} taskfile/verify.ps1 -Mutation"

  # --- docs --------------------------------------------------------------------

  docs:
    desc: Serve the documentation locally with live reload
    cmds:
      - "{{.PS}} taskfile/docs.ps1 -Mode serve"

  docs:build:
    desc: Build the static documentation site into ./site
    cmds:
      - "{{.PS}} taskfile/docs.ps1 -Mode build"

  # --- housekeeping ------------------------------------------------------------

  clean:
    desc: Remove build outputs (add -- -Lean to also drop lean/.lake)
    cmds:
      - "{{.PS}} taskfile/clean.ps1 {{.CLI_ARGS}}"
