name: verify

# The same gate as `task verify:full` locally: proofs, audit, drift,
# .NET + Go conformance and mutation testing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean') }}
          restore-keys: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-go@v6
        with:
          go-version-file: impl/go/go.mod
          cache: false

      - uses: go-task/setup-task@v1

      - name: Verify (proofs, audit, drift, conformance, mutation)
        shell: pwsh
        run: task verify:full
